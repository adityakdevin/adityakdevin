name: Profile summary cards

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-cards.yml"

# Read-only by default; only the job that must commit gets write.
permissions:
  contents: read

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # SHA-pinned. This one was on `@release` - a BRANCH, so every nightly run
      # pulled whatever HEAD happened to be, with write access to this repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: vn7n24fzkq/github-profile-summary-cards@4a9822e91a20eae650b9591769569976f0d578ba # release @ 2026-07-27
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 5.5
