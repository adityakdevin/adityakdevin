name: Latest blog posts

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Read-only by default; only the job that must commit gets write.
permissions:
  contents: read

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Actions are pinned to commit SHAs, not mutable tags. A nightly cron with
      # contents:write is exactly the job you don't want re-pointed under you:
      # whoever controls the tag would get to commit to this repo as the bot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gautamkrishnar/blog-post-workflow@2786e54a01b71aec80a5118c2bd6b5044e842597 # v1
        # fails harmlessly until the first dev.to post exists
        continue-on-error: true
        with:
          # Site feed FIRST: posts are canonical on adityadev.in and only some get
          # syndicated, so a Dev.to-only feed silently hides every site-first post.
          # Both are listed because the older series lives on Dev.to as canonical.
          feed_list: "https://adityadev.in/blog/rss.xml,https://dev.to/feed/adityakdevin"
          max_post_count: 5
          commit_message: "chore: update latest blog posts"
