# CI gate. Until 2026-07-26 the only enforcement in this repo was a local
# .git/hooks/pre-commit - not versioned, absent on a fresh clone, and skipped by
# --no-verify. Both text-hygiene lenses run here so the claims gate cannot be
# bypassed by the machine that happens to be committing.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast lane: fails in under a minute on the cheap checks, so a typo does not
  # wait behind a Next build and a browser download.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run hygiene
      - run: npm run lint
      - run: npm test

  # Slow lane: catches what the fast lane structurally cannot. vitest does not
  # typecheck, so a required-field change compiles in test and breaks the build;
  # and every route-level regression this repo has hit was only visible in a
  # real browser against a real build.
  build-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The production build, with the REAL content. `npm run test:e2e` builds
      # too, but with POSTS_DIR pointed at fixtures - so it would not catch a
      # break that only the authored MDX triggers.
      - run: npm run build

      # Both playwright projects are chromium (Desktop Chrome + Pixel 7), so
      # there is nothing to gain from installing firefox and webkit.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # test-results/, not playwright-report/: the config uses reporter "list",
      # so no HTML report is ever written. This is where the failure context,
      # screenshots and traces land.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: site/test-results/
          if-no-files-found: ignore
          retention-days: 7
